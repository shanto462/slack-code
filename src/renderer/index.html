<!doctype html>
<html lang="en" data-theme="light" data-vibrancy="off" data-focus="on" data-motion="full">
  <head>
    <meta charset="UTF-8" />
    <!--
      The renderer is sandboxed with contextIsolation and never loads remote
      content, so everything is locked to 'self'. style-src needs unsafe-inline
      because the shell sets the accent colour as an inline custom property, and
      connect-src allows the dev server's HMR socket.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws://localhost:* http://localhost:*; form-action 'none'; base-uri 'none'"
    />
    <title>slack-code</title>
    <link rel="stylesheet" href="./styles/index.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./shell.ts"></script>
  </body>
</html>
